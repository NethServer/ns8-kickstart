name: Test module
# The run belongs to the default branch under workflow_run: name the tested one.
run-name: "Test ${{ github.event.workflow_run.head_branch || github.ref_name }} on QEMU"

on:
  workflow_dispatch:
    inputs:
      debug_shell:
        description: "Debug shell"
        required: true
        type: boolean
  workflow_run:
    workflows: ["Publish images"]
    types: [completed]

jobs:
  run:
    name: "Run tests"
    permissions:
      contents: write
      pull-requests: write
      statuses: write
    uses: NethServer/ns8-github-actions/.github/workflows/test-module-qemu.yml@fix-screenshots-hosting
    with:
      ui_tests_strategy: always
      ci_actions_ref: fix-screenshots-hosting
      # One leg only, to keep the test short
      distros: '["rocky9"]'
      scenarios: '["install"]'
      debug_shell: ${{ github.event.inputs.debug_shell == 'true' }}
      # Other inputs: https://github.com/NethServer/ns8-github-actions/blob/v1/docs/test-module-qemu.md#inputs
